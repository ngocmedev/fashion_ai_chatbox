<!-- ========================================================================
     SITE HEADER COMPONENT (Sticky Glassmorphic Navigation)
     ======================================================================== -->
<header class="site-header">
  <div class="header-container">
    <a href="/" class="brand-logo" aria-label="Evern. Trang chủ">
      Evern<span class="brand-dot">.</span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="main-nav" aria-label="Menu điều hướng chính">
      <a href="/" class="nav-link">Khám phá</a>
      <a href="/products" class="nav-link">Sản phẩm</a>
      <a href="javascript:void(0)" class="nav-link" onclick="Chat.openChat();">Tư vấn Stylist</a>
      <a href="/#trendingSection" class="nav-link">Xu hướng</a>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <!-- Search bar inside header -->
      <div style="position: relative; display: flex; align-items: center;">
        <input type="text" id="headerSearchInput" placeholder="Tìm kiếm outfit, vibe..." aria-label="Tìm kiếm sản phẩm"
          style="background: rgba(255, 255, 255, 0.65); border: 1px solid var(--border-color); border-radius: var(--radius-full); padding: 7px 14px 7px 32px; font-size: 13px; color: var(--text-primary); width: 180px; transition: width 200ms ease;"
          onfocus="this.style.width='240px'; this.style.borderColor='var(--text-primary)'"
          onblur="this.style.width='180px'; this.style.borderColor='var(--border-color)'">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          style="position: absolute; left: 11px; color: var(--text-secondary); pointer-events: none;">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </div>

      <!-- Wishlist Button -->
      <button id="btnViewSaved" class="btn-header-icon" aria-label="Xem sản phẩm đã lưu" title="Bộ sưu tập yêu thích"
        onclick="Wishlist.open()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
        <span id="wishlistCountBadge" class="badge-count" style="display: none;">0</span>
      </button>

      <!-- User Authentication State -->
      {% if current_user %}
      <div class="user-dropdown-wrapper" id="userDropdownWrapper" style="position: relative;">
        <button type="button" class="user-avatar-pill" id="userMenuBtn" title="Tài khoản cá nhân"
          style="cursor: pointer;">
          <div
            style="width: 28px; height: 28px; border-radius: 50%; background: #111; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;">
            {{ current_user.username[:1].upper() }}
          </div>
          <span>{{ current_user.full_name or current_user.username }}</span>
          <i class="fa-solid fa-angle-down"
            style="font-size: 11px; color: var(--text-secondary); margin-left: 2px;"></i>
        </button>

        <div class="user-dropdown-menu" id="userDropdownMenu">
          <div
            style="padding: 10px 14px; border-bottom: 1px solid var(--border-subtle); font-size: 12px; color: var(--text-secondary);">
            Xin chào,<br><strong style="color: var(--text-primary); font-size: 13px;">{{ current_user.full_name or
              current_user.username }}</strong>
            <div style="font-size: 11.5px; color: #888; margin-top: 2px;">@{{ current_user.username }}</div>
          </div>
          <div style="padding: 4px 0;">
            <a href="/profile" class="user-dropdown-link"
              style="display: flex; align-items: center; gap: 10px; padding: 9px 14px; font-size: 13px; font-weight: 500; border-radius: var(--radius-sm); color: var(--text-primary); text-decoration: none; transition: background 150ms;">
              <i class="fa-regular fa-address-card" style="color: #4F46E5; width: 16px; font-size: 14px;"></i> Thông tin
              cá nhân
            </a>
            {% if current_user.role == 'admin' %}
            <a href="/admin/dashboard" class="user-dropdown-link"
              style="display: flex; align-items: center; gap: 10px; padding: 9px 14px; font-size: 13px; font-weight: 700; border-radius: var(--radius-sm); color: #FF4D30; background: rgba(255, 77, 48, 0.08); text-decoration: none; transition: background 150ms; margin: 4px 6px;">
              <i class="fa-solid fa-shield-halved" style="color: #FF4D30; width: 16px; font-size: 14px;"></i> Quản Trị Admin
            </a>
            {% endif %}
          </div>
          <div style="border-top: 1px solid var(--border-subtle); padding-top: 4px; margin-top: 2px;">
            <a href="/logout" class="user-dropdown-link logout"
              style="display: flex; align-items: center; gap: 10px; padding: 9px 14px; font-size: 13px; font-weight: 600; border-radius: var(--radius-sm); color: #DC2626; text-decoration: none; transition: background 150ms;">
              <i class="fa-solid fa-arrow-right-from-bracket" style="width: 16px; font-size: 14px;"></i> Đăng xuất
            </a>
          </div>
        </div>
      </div>

      <!-- Nút Giỏ Hàng (chỉ hiển thị khi đã đăng nhập, nằm ở bên phải tên user) -->
      <button id="btnOpenCart" class="btn-header-icon" aria-label="Xem giỏ hàng" title="Giỏ hàng của bạn"
        style="position: relative;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span id="cartCountBadge" class="badge-count" style="display: none;">0</span>
      </button>
      {% else %}
      <div class="auth-btn-group" style="display: flex; align-items: center; gap: 8px;">
        <a href="/login" class="btn-secondary"
          style="padding: 7px 14px; font-size: 12.5px; border-radius: var(--radius-full);">
          Đăng nhập
        </a>
        <a href="/register" class="btn-primary"
          style="padding: 7px 16px; font-size: 12.5px; border-radius: var(--radius-full);">
          Đăng ký
        </a>
      </div>
      {% endif %}
    </div>
  </div>
</header>
