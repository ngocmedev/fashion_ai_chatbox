<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="evernGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="80" cy="80" r="80" fill="url(#evernGrad)"/>
  <!-- Inner subtle luxury ring -->
  <circle cx="80" cy="80" r="76" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- Stylized Monogram E -->
  <text x="68" y="99" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="66" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">E</text>
  <!-- Coral Brand Dot -->
  <circle cx="106" cy="94" r="7.5" fill="#FF4D30"/>
  <!-- Brand Name Subtitle -->
  <text x="80" y="125" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="3.5">EVERN</text>
</svg>
